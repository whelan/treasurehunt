<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frank</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #87ceeb 0%, #b8e6b8 45%, #2e8b57 46%, #1f6b3f 100%);
            font-family: "Segoe UI", sans-serif;
            color: #333;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 320px;
        }
        
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #1f6b3f;
        }

        p {
            color: #333;
            margin: 0.5rem 0;
            line-height: 1.8;
        }

        button {
            margin-top: 1rem;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            background: #1f6b3f;
            color: #fff;
            font-weight: bold;
        }

        button:hover {
            background: #174f2e;
        }

        @media (max-width: 600px) {
            body {
                flex-direction: column;
                padding: 1rem;
                font-size: 1.2rem;
            }

            .card {
                width: 90%;
                padding: 1.5rem;
                font-size: 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            button {
                font-size: 1rem;
            }
        }

    </style>
</head>
<body>
    <div class="card">
        <h1>⛳ Frank 🏌️</h1>
        <p>HjkVipAswDtd<br>
        HwsEghDioDwqExcRaq<br>
        DpåErwNqx<br>
        BcvEyuDqwSopTczExs<br>
        SmnAbnNqxGxz?</p>
        <br>
        <br>
        <span style="color:#1f6b3f">Send SMS til Jannie med svaret</span>
    </div>
</body>
</html>
