<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frank</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #87ceeb 0%, #b8e6b8 45%, #2e8b57 46%, #1f6b3f 100%);
            font-family: "Segoe UI", sans-serif;
            color: #333;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 320px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #1f6b3f;
        }

        p {
            color: #333;
            font-size: 1rem;
        }

        input {
            width: 100%;
            padding: 0.7rem;
            margin-top: 1rem;
            border-radius: 8px;
            border: 2px solid #1f6b3f;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            margin-top: 1rem;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            background: #1f6b3f;
            color: #fff;
            font-weight: bold;
        }

        button:hover {
            background: #174f2e;
        }

        #result {
            margin-top: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        @media (max-width: 600px) {
            body {
                flex-direction: column;
                padding: 1rem;
                font-size: 1.2rem;
            }

            .card {
                width: 90%;
                padding: 1.5rem;
                font-size: 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            input,
            button {
                font-size: 1rem;
            }

            #result {
                font-size: 1rem;
            }
        }

    </style>
</head>
<body>
    <div class="card">
        <h1>⛳ Frank 🏌️</h1>
        <p>What is the password?</p>

        <input id="answer" type="text" placeholder="Type your answer here">
        <button onclick="checkAnswer()">Check</button>

        <div id="result"></div>
    </div>

    <script>
        function checkAnswer() {
            const input = document.getElementById("answer").value.trim();
            const result = document.getElementById("result");

            if (input === "Ørsted" || input === "ørsted") {
                result.textContent = "✓ Correct – redirecting…";
                result.style.color = "#2ecc71";

                setTimeout(() => {
                    window.location.href = "https://whelan.github.io/treasurehunt/Side2.html";
                }, 800);
            } else {
                result.textContent = "Try again";
                result.style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
